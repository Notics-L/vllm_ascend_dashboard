[project]
name = "vllm-ascend-dashboard-backend"
version = "0.1.0"
description = "vLLM Ascend Community Dashboard - Backend Service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "vLLM Ascend Team"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "greenlet>=3.0.0",
    "aiomysql>=0.1.1",
    "pymysql>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=50.0.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.25.2",
    "aiohttp>=3.14.3",
    "click>=8.3.3",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.6",
    "alembic>=1.13.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "kubernetes-asyncio>=29.0.0",
    "aiosmtplib>=1.1.0",
    "jinja2>=3.1.0",
    "lizard>=1.17.0,<2.0.0",
    "markdown>=3.5",
    "matplotlib>=3.8",
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
    "smolagents[litellm]>=1.26.0,<2.0.0",
    "litellm>=1.84.0,<1.85.0",
    "chompjs>=1.3.0",
    "coverage>=7.15.2,<8",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pip-audit>=2.7.3,<3.0.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
litellm = ["maturin"]

[tool.hatch.build.targets.wheel]
packages = [
    "agent",
    "api",
    "collector",
    "contracts",
    "contributor_board",
    "failure_analysis",
    "infrastructure",
    "log_center",
    "model_sync",
    "nightly_gantt",
    "pr_pipeline",
    "project_dashboard",
    "resource_dashboard",
    "reporting",
    "scheduler",
    "seeds",
    "support_matrix",
    "test_board",
    "tooling",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    # These modules intentionally translate exceptions at API boundaries without
    # exposing the internal traceback, and use late imports for compatibility
    # re-exports / runtime path setup.
    "B904",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = [".."]
addopts = "-v --cov=api --cov=collector --cov=resource_dashboard --cov=scheduler --cov-report=term-missing"
