name: Build and Push Docker Images

# Phase 0 Step 6: Pre-built images → GitHub Container Registry
#
# 触发条件:
#   - push main 分支（自动打 date-序号 tag）
#   - push 任何 tag（用 tag 名作为镜像版本）
#   - 手动 workflow_dispatch（可指定版本号）

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号 (留空则自动生成 YYYYMMDD-N)'
        required: false
      skip_quality:
        description: '仅用于临时镜像构建验证：跳过质量检查（不会用于普通 push）'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  quality:
    # 质量检查仅在 PR 上运行（信息性，不阻塞构建）。
    # push/dispatch 直接构建 —— 敏捷优先，速度优先。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: vllm_dashboard_test
          MYSQL_USER: dashboard
          MYSQL_PASSWORD: test-database-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependencies
        working-directory: backend
        env:
          TEST_DATABASE_URL: mysql+aiomysql://dashboard:test-database-password@127.0.0.1:3306/vllm_dashboard_test
          DATABASE_URL: mysql+aiomysql://dashboard:test-database-password@127.0.0.1:3306/vllm_dashboard_test
          JWT_SECRET: test-jwt-secret-key-at-least-32-chars-long
          GITHUB_TOKEN: github_pat_test_token_for_ci_tests
        run: |
          # Tests import the source tree directly; do not build/install the
          # application wheel just to run the quality gate. This keeps CI
          # independent of Hatchling's editable-build path.
          uv sync --locked --dev --no-install-project

      - name: Backend lint
        working-directory: backend
        run: uv run --no-sync ruff check . ../tests

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: mysql+aiomysql://dashboard:test-database-password@127.0.0.1:3306/vllm_dashboard_test
          DATABASE_URL: mysql+aiomysql://dashboard:test-database-password@127.0.0.1:3306/vllm_dashboard_test
          JWT_SECRET: test-jwt-secret-key-at-least-32-chars-long
          GITHUB_TOKEN: github_pat_test_token_for_ci_tests
        run: uv run --no-sync pytest -q

      - name: Backend dependency audit
        working-directory: backend
        # ecdsa has no upstream fixed release for PYSEC-2026-1325 yet;
        # keep the strict audit for all actionable vulnerabilities.
        run: uv run --no-sync pip-audit --strict --ignore PYSEC-2026-1325

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test -- --run
          pnpm build
          pnpm audit --prod --audit-level=high

  build-backend:
    # push/dispatch 即刻构建，不等质量门；与 build-frontend 并行。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 版本号推导：dispatch 指定 > git tag > 日期-短sha ──
      - name: Determine version tag
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing as: $VER"
      - name: Diagnose Docker registry DNS
        run: |
          echo "=== DNS: DaoCloud ==="
          getent hosts docker.m.daocloud.io || true

          echo "=== DNS: Docker Hub ==="
          getent hosts registry-1.docker.io || true

          echo "=== HTTP: DaoCloud ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://docker.m.daocloud.io/v2/ || true

          echo "=== HTTP: Docker Hub ==="
          curl -Iv --connect-timeout 10 --max-time 20 https://registry-1.docker.io/v2/ || true
      - name: Build and push backend
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}@${{ steps.backend_image.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version tag
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing as: $VER"

      - name: Build and push frontend
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          # Vite API configuration is compiled into the static bundle.  A
          # runtime container environment variable cannot change it later.
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}@${{ steps.frontend_image.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
