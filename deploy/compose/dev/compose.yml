# Single local development topology for Windows, Linux, and macOS.
# Start it through ./dev-setup.ps1 or ./dev-setup.sh so .env.local is created
# with a non-default JWT secret when needed.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vllm_dashboard}
      MYSQL_USER: ${MYSQL_USER:-dashboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DEV_MYSQL_PORT:-3308}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "false"
    entrypoint: []
    command: ["/bin/sh", "/app/litellm-entrypoint.sh"]
    volumes:
      - ../../config-templates/litellm_config.yaml:/app/litellm_config.yaml
      - ../production/litellm-entrypoint.sh:/app/litellm-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',4000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../../../
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env.local
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-dashboard}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${API_DB_POOL_TIMEOUT:-30}
      ENVIRONMENT: development
      DEBUG: "true"
      AUTO_MIGRATE: "true"
      DATA_DIR: /app/data
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AGENT_SERVICE_ENABLED: "false"
      AGENT_PROXY_ONLY: "true"
      AGENT_PROXY_ALLOWED_HOSTS: litellm
      NPU_DASHBOARD_REPLAY_SNAPSHOT: ${NPU_DASHBOARD_REPLAY_SNAPSHOT:-}
    ports:
      - "${DEV_BACKEND_PORT:-8000}:8000"
    volumes:
      - dev_backend_data:/app/data
      - ../../config-templates/litellm_config.yaml:/app/litellm_config.yaml
      - ../../../file:/app/replay:ro
    depends_on:
      mysql:
        condition: service_healthy
      litellm:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  migration:
    build:
      context: ../../../
      dockerfile: backend/api/Dockerfile
    env_file:
      - ../../../.env.local
    environment:
      # Production migrations use a privileged connection because the logical
      # dashboard schema can expose control-plane base tables through views.
      # Keep runtime services on the restricted dashboard account.
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      ENVIRONMENT: development
      DATA_DIR: /app/data
    command: python database/migrations/migrate.py
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${DEV_FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

  scheduler:
    build:
      context: ../../../
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env.local
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-dashboard}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      DB_POOL_SIZE: ${SCHEDULER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${SCHEDULER_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${SCHEDULER_DB_POOL_TIMEOUT:-30}
      ENVIRONMENT: development
      DATA_DIR: /app/data
    command: python -m scheduler
    volumes:
      - dev_backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scheduler.health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    profiles: ["workers"]

  collector:
    build:
      context: ../../../
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env.local
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-dashboard}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vllm_dashboard}
      DB_POOL_SIZE: ${COLLECTOR_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${COLLECTOR_DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${COLLECTOR_DB_POOL_TIMEOUT:-30}
      ENVIRONMENT: development
      DATA_DIR: /app/data
      NODE_ID: collector-dev-1
      CAPABILITIES: python
    command: python -m collector
    volumes:
      - dev_backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "collector.health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    profiles: ["workers"]

volumes:
  dev_mysql_data:
  dev_backend_data:
